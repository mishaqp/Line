name: Repair chat compact once

on:
  push:
    branches:
      - feat/chat-compact

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: run one-time chat compact repair'
    runs-on: ubuntu-latest
    steps:
      - name: Restore and patch full sources through Contents API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: feat/chat-compact
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          token = os.environ['GITHUB_TOKEN']
          composer_path = 'app/src/main/java/cn/lineai/ui/component/ComposerView.java'
          main_path = 'app/src/main/java/cn/lineai/ui/MainChatView.java'
          source_sha = '8dc4fe1ae32056452294120d310fab7bcded60f4'

          def request(url, *, method='GET', payload=None, auth=True):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'line-chat-compact-repair'
              }
              if auth:
                  headers['Authorization'] = f'Bearer {token}'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return response.read()

          def raw(path, ref):
              url = f'https://raw.githubusercontent.com/{repo}/{ref}/{path}'
              return request(url, auth=False).decode('utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          def update_full(path, text, message):
              quoted = urllib.parse.quote(path, safe='/')
              meta_url = f'https://api.github.com/repos/{repo}/contents/{quoted}?ref={urllib.parse.quote(branch)}'
              meta = json.loads(request(meta_url).decode('utf-8'))
              if not isinstance(meta, dict) or not meta.get('sha'):
                  raise RuntimeError(f'Cannot resolve current blob sha for {path}')
              payload = {
                  'message': message,
                  'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
                  'sha': meta['sha'],
                  'branch': branch,
              }
              result = json.loads(request(
                  f'https://api.github.com/repos/{repo}/contents/{quoted}',
                  method='PUT', payload=payload).decode('utf-8'))
              print(path, result.get('commit', {}).get('sha', '<no commit sha>'), len(text))

          # 1) Always start from the exact raw file requested by the user.
          composer = raw(composer_path, source_sha)
          if len(composer) < 20000 or not composer.startswith('package cn.lineai.ui.component;'):
              raise RuntimeError(f'Unexpected ComposerView source from {source_sha}: {len(composer)} bytes')
          if composer.strip() in {'PLACEHOLDER', 'see-file'}:
              raise RuntimeError('Refusing placeholder ComposerView')

          composer = replace_once(
              composer,
              '        void onImagePickerClick();\n\n        void onModeChanged(String mode);',
              '        void onImagePickerClick();\n\n        void onCompactClick();\n\n        void onModeChanged(String mode);',
              'ComposerView.Listener.onCompactClick')

          # Remove the old top metadata row entirely and keep model selection as a compact sparkles button.
          start = composer.index('        LinearLayout metaRow = new LinearLayout(context);')
          end_marker = '        panel.addView(divider, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, 1));\n'
          end = composer.index(end_marker, start) + len(end_marker)
          model_button = '''        modelSelectorButton = new LinearLayout(context);
          modelSelectorButton.setOrientation(HORIZONTAL);
          modelSelectorButton.setGravity(Gravity.CENTER);
          modelSelectorButton.setClickable(true);
          modelSelectorButton.setFocusable(true);
          modelSelectorButton.setOnClickListener(v -> showModelPopup(modelSelectorButton));
          modelSelectorButton.setBackground(LineCards.chipBackground(context));
          LineTheme.attachStateLayer(modelSelectorButton);
          IconButtonView modelIcon = new IconButtonView(context, IconButtonView.SPARKLES);
          modelIcon.setIconColor(LineTheme.ACCENT);
          modelIcon.setIconSizeDp(40, 20);
          modelIcon.setClickable(false);
          modelSelectorButton.addView(modelIcon, new LinearLayout.LayoutParams(
                  LineTheme.dp(context, 40), LineTheme.dp(context, 40)));

'''
          # Dedent only the accidental Python-block indentation while preserving Java indentation.
          model_button = '\n'.join(line[10:] if line.startswith('          ') else line for line in model_button.split('\n'))
          composer = composer[:start] + model_button + composer[end:]
          composer = replace_once(composer,
              '        panel.setMinimumHeight(LineTheme.dp(context, 148));',
              '        panel.setMinimumHeight(LineTheme.dp(context, 112));',
              'compact panel height')

          # Input row = text + expand.
          input_anchor = '''        LinearLayout.LayoutParams inputParams = new LinearLayout.LayoutParams(0, LayoutParams.WRAP_CONTENT, 1f);
          inputRow.addView(input, inputParams);
'''
          input_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in input_anchor.split('\n'))
          input_replacement = '''        LinearLayout.LayoutParams inputParams = new LinearLayout.LayoutParams(0, LayoutParams.WRAP_CONTENT, 1f);
          inputRow.addView(input, inputParams);

          IconButtonView expandButton = new IconButtonView(context, IconButtonView.EXPAND);
          expandButton.setIconColor(LineTheme.TEXT_SECONDARY);
          expandButton.setIconSizeDp(40, 19);
          expandButton.setContentDescription(context.getString(R.string.composer_expand_desc));
          LineTheme.attachStateLayer(expandButton);
          expandButton.setOnClickListener(v -> showExpandPopup(expandButton));
          LinearLayout.LayoutParams expandParams = new LinearLayout.LayoutParams(
                  LineTheme.dp(context, 40), LineTheme.dp(context, 40));
          inputRow.addView(expandButton, expandParams);
'''
          input_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in input_replacement.split('\n'))
          composer = replace_once(composer, input_anchor, input_replacement, 'input expand button')

          # Replace the old bottom row (attach/image/mode chip/send) with model/reasoning/spacer/plus/send.
          row_start = composer.index('        LinearLayout modeRow = new LinearLayout(context);')
          row_end_marker = '        modeRow.addView(sendButton, sendParams);\n'
          row_end = composer.index(row_end_marker, row_start) + len(row_end_marker)
          toolbar = '''        LinearLayout toolbarRow = new LinearLayout(context);
          toolbarRow.setOrientation(HORIZONTAL);
          toolbarRow.setGravity(Gravity.CENTER_VERTICAL);
          LineTheme.padding(toolbarRow, LineTheme.SM, 0, LineTheme.SM, LineTheme.SM);
          panel.addView(toolbarRow, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT));

          LinearLayout.LayoutParams modelParams = new LinearLayout.LayoutParams(
                  LineTheme.dp(context, 40), LineTheme.dp(context, 40));
          modelParams.rightMargin = LineTheme.dp(context, LineTheme.XS);
          toolbarRow.addView(modelSelectorButton, modelParams);

          IconButtonView reasoningButton = new IconButtonView(context, IconButtonView.BRAIN);
          reasoningButton.setIconColor(LineTheme.TEXT_SECONDARY);
          reasoningButton.setIconSizeDp(40, 20);
          LineTheme.attachStateLayer(reasoningButton);
          reasoningButton.setOnClickListener(v -> showReasoningPopup(reasoningButton));
          LinearLayout.LayoutParams reasoningParams = new LinearLayout.LayoutParams(
                  LineTheme.dp(context, 40), LineTheme.dp(context, 40));
          toolbarRow.addView(reasoningButton, reasoningParams);

          View spacer = new View(context);
          toolbarRow.addView(spacer, new LinearLayout.LayoutParams(0, 1, 1f));

          IconButtonView plusButton = new IconButtonView(context, IconButtonView.PLUS);
          plusButton.setIconColor(LineTheme.TEXT_SECONDARY);
          plusButton.setIconSizeDp(40, 21);
          LineTheme.attachStateLayer(plusButton);
          plusButton.setOnClickListener(v -> showPlusPopup(plusButton));
          LinearLayout.LayoutParams plusParams = new LinearLayout.LayoutParams(
                  LineTheme.dp(context, 40), LineTheme.dp(context, 40));
          plusParams.rightMargin = LineTheme.dp(context, LineTheme.XS);
          toolbarRow.addView(plusButton, plusParams);

          LinearLayout.LayoutParams sendParams = new LinearLayout.LayoutParams(
                  LineTheme.dp(context, 40), LineTheme.dp(context, 40));
          toolbarRow.addView(sendButton, sendParams);
'''
          toolbar = '\n'.join(line[10:] if line.startswith('          ') else line for line in toolbar.split('\n'))
          composer = composer[:row_start] + toolbar + composer[row_end:]

          # Meta/model labels were visual-only; the compact toolbar has icon controls instead.
          composer = replace_once(composer,
              '        modelText.setText(state.getModelLabel());\n', '', 'remove hidden model label render')
          composer = replace_once(composer,
              '        contextText.setText(state.getContextLabel());\n        contextText.setTextColor(state.getContextPercent() >= 80 ? LineTheme.WARNING : LineTheme.TEXT_TERTIARY);\n',
              '', 'remove hidden context meta render')
          composer = replace_once(composer,
              '        updateModeButtons();\n', '', 'remove bottom mode chip state update')
          composer = replace_once(composer,
              '        modelChevron.setIconColor(streaming ? LineTheme.TEXT_TERTIARY : LineTheme.TEXT_SECONDARY);\n',
              '', 'remove hidden model chevron state update')

          # Popup helpers for expand, reasoning and plus.
          helper_anchor = '    private PopupWindow modelSubPopup;\n'
          helpers = r'''    private void showExpandPopup(View anchor) {
              if (streaming) return;
              Context context = getContext();
              LinearLayout content = new LinearLayout(context);
              content.setOrientation(VERTICAL);
              content.setBackground(LineTheme.roundedStroke(context, LineTheme.SURFACE_ELEVATED,
                      LineTheme.SHAPE_LG, LineTheme.BORDER));
              LineTheme.padding(content, LineTheme.MD, LineTheme.MD, LineTheme.MD, LineTheme.MD);

              TextView title = LineTheme.textMedium(context,
                      context.getString(R.string.composer_expand_title), LineTheme.FONT_SM, LineTheme.TEXT);
              content.addView(title, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT));

              EditText expanded = new EditText(context);
              expanded.setText(input.getText());
              expanded.setSelection(expanded.getText().length());
              expanded.setTextColor(LineTheme.TEXT);
              expanded.setHintTextColor(LineTheme.TEXT_TERTIARY);
              expanded.setTextSize(LineTheme.chatSp(LineTheme.TYPE_BODY));
              expanded.setSingleLine(false);
              expanded.setMinLines(7);
              expanded.setMaxLines(14);
              expanded.setGravity(Gravity.TOP | Gravity.START);
              expanded.setBackgroundColor(android.graphics.Color.TRANSPARENT);
              expanded.setPadding(0, LineTheme.dp(context, LineTheme.SM), 0, LineTheme.dp(context, LineTheme.SM));
              content.addView(expanded, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT));

              PopupWindow popup = new PopupWindow(content, LineTheme.dp(context, 320),
                      LayoutParams.WRAP_CONTENT, true);
              popup.setOutsideTouchable(true);
              popup.setBackgroundDrawable(new ColorDrawable(android.graphics.Color.TRANSPARENT));

              TextView save = LineTheme.textMedium(context,
                      context.getString(R.string.composer_expand_save), LineTheme.FONT_SM, LineTheme.ACCENT);
              save.setGravity(Gravity.CENTER);
              save.setClickable(true);
              save.setFocusable(true);
              save.setBackground(LineCards.chipBackground(context));
              LineTheme.attachStateLayer(save);
              save.setOnClickListener(v -> {
                  input.setText(expanded.getText());
                  input.setSelection(input.getText().length());
                  popup.dismiss();
                  input.requestFocus();
              });
              LinearLayout.LayoutParams saveParams = new LinearLayout.LayoutParams(
                      LayoutParams.MATCH_PARENT, LineTheme.dp(context, 40));
              content.addView(save, saveParams);
              popup.showAsDropDown(anchor, -LineTheme.dp(context, 280), LineTheme.dp(context, 6));
              expanded.requestFocus();
          }

          private void showReasoningPopup(View anchor) {
              if (streaming) return;
              Context context = getContext();
              LinearLayout content = new LinearLayout(context);
              content.setOrientation(VERTICAL);
              content.setBackground(LineTheme.roundedStroke(context, LineTheme.SURFACE_ELEVATED,
                      LineTheme.SHAPE_LG, LineTheme.BORDER));
              LineTheme.padding(content, LineTheme.SM, LineTheme.SM, LineTheme.SM, LineTheme.SM);
              PopupWindow popup = new PopupWindow(content, LineTheme.dp(context, 196),
                      LayoutParams.WRAP_CONTENT, true);
              popup.setOutsideTouchable(true);
              popup.setBackgroundDrawable(new ColorDrawable(android.graphics.Color.TRANSPARENT));

              String[] values = {
                      AiBehaviorSettings.REASONING_OFF,
                      AiBehaviorSettings.REASONING_AUTO,
                      AiBehaviorSettings.REASONING_LOW,
                      AiBehaviorSettings.REASONING_MEDIUM,
                      AiBehaviorSettings.REASONING_HIGH,
                      AiBehaviorSettings.REASONING_MAX
              };
              int[] labels = {
                      R.string.composer_reasoning_off,
                      R.string.composer_reasoning_auto,
                      R.string.composer_reasoning_low,
                      R.string.composer_reasoning_medium,
                      R.string.composer_reasoning_high,
                      R.string.composer_reasoning_max
              };
              TextView title = LineTheme.textMedium(context,
                      context.getString(R.string.composer_reasoning_title), LineTheme.FONT_XS, LineTheme.TEXT_SECONDARY);
              LineTheme.padding(title, LineTheme.SM, LineTheme.XS, LineTheme.SM, LineTheme.SM);
              content.addView(title, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT));
              for (int i = 0; i < values.length; i++) {
                  final String value = values[i];
                  TextView item = LineTheme.textMedium(context, context.getString(labels[i]),
                          LineTheme.FONT_SM, LineTheme.TEXT);
                  item.setGravity(Gravity.CENTER_VERTICAL);
                  item.setClickable(true);
                  item.setFocusable(true);
                  LineTheme.padding(item, LineTheme.MD, 0, LineTheme.MD, 0);
                  LineTheme.attachStateLayer(item);
                  item.setOnClickListener(v -> {
                      popup.dismiss();
                      if (listener != null) listener.onAiReasoningEffortChanged(value);
                  });
                  content.addView(item, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT,
                          LineTheme.dp(context, 40)));
              }
              popup.showAsDropDown(anchor, 0, LineTheme.dp(context, 6));
          }

          private void showPlusPopup(View anchor) {
              if (streaming) return;
              Context context = getContext();
              LinearLayout content = new LinearLayout(context);
              content.setOrientation(VERTICAL);
              content.setBackground(LineTheme.roundedStroke(context, LineTheme.SURFACE_ELEVATED,
                      LineTheme.SHAPE_LG, LineTheme.BORDER));
              LineTheme.padding(content, LineTheme.SM, LineTheme.SM, LineTheme.SM, LineTheme.SM);
              PopupWindow popup = new PopupWindow(content, LineTheme.dp(context, 210),
                      LayoutParams.WRAP_CONTENT, true);
              popup.setOutsideTouchable(true);
              popup.setBackgroundDrawable(new ColorDrawable(android.graphics.Color.TRANSPARENT));

              TextView file = compactPopupItem(context, context.getString(R.string.composer_plus_file));
              file.setOnClickListener(v -> {
                  popup.dismiss();
                  if (listener != null) listener.onAttachClick();
              });
              content.addView(file, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LineTheme.dp(context, 40)));

              TextView image = compactPopupItem(context, context.getString(R.string.composer_plus_image));
              image.setOnClickListener(v -> {
                  popup.dismiss();
                  if (listener != null) listener.onImagePickerClick();
              });
              content.addView(image, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LineTheme.dp(context, 40)));

              TextView compact = compactPopupItem(context, context.getString(R.string.composer_plus_compact));
              compact.setOnClickListener(v -> {
                  popup.dismiss();
                  if (listener != null) listener.onCompactClick();
              });
              content.addView(compact, new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LineTheme.dp(context, 40)));
              popup.showAsDropDown(anchor, -LineTheme.dp(context, 170), LineTheme.dp(context, 6));
          }

          private TextView compactPopupItem(Context context, String label) {
              TextView item = LineTheme.textMedium(context, label, LineTheme.FONT_SM, LineTheme.TEXT);
              item.setGravity(Gravity.CENTER_VERTICAL);
              item.setClickable(true);
              item.setFocusable(true);
              LineTheme.padding(item, LineTheme.MD, 0, LineTheme.MD, 0);
              LineTheme.attachStateLayer(item);
              return item;
          }

'''
          helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in helpers.split('\n'))
          composer = replace_once(composer, helper_anchor, helpers + helper_anchor, 'compact popup helpers')

          if 'PLACEHOLDER' in composer or composer.strip() == 'see-file':
              raise RuntimeError('ComposerView still contains placeholder content')
          if 'LinearLayout metaRow' in composer:
              raise RuntimeError('metaRow was not removed')
          if 'IconButtonView.SPARKLES' not in composer or 'IconButtonView.BRAIN' not in composer or 'IconButtonView.EXPAND' not in composer:
              raise RuntimeError('compact toolbar icons missing')
          if 'listener.onCompactClick()' not in composer:
              raise RuntimeError('compact callback missing')

          # MainChatView: use current branch source and add exactly the requested listener wiring.
          main = raw(main_path, branch)
          header_block = '''            @Override
              public void onProjectClick() {
                  MainChatView.this.presenter.onProjectClick();
              }

'''
          header_block = '\n'.join(line[14:] if line.startswith('              ') else line for line in header_block.split('\n'))
          header_replacement = header_block + '''            @Override
            public void onModeChanged(String mode) {
                MainChatView.this.presenter.onChatModeChanged(mode);
            }

'''
          main = replace_once(main, header_block, header_replacement, 'HeaderView.Listener.onModeChanged')

          image_block = '''            @Override
              public void onImagePickerClick() {
                  MainChatView.this.presenter.onImagePickerRequested();
              }

'''
          image_block = '\n'.join(line[14:] if line.startswith('              ') else line for line in image_block.split('\n'))
          compact_callback = image_block + '''            @Override
            public void onCompactClick() {
                MainChatView.this.presenter.onSheetOptionSelected("compact");
            }

'''
          main = replace_once(main, image_block, compact_callback, 'ComposerView.Listener.onCompactClick wiring')

          if 'MainChatView.this.presenter.onChatModeChanged(mode);' not in main:
              raise RuntimeError('Header mode callback missing after patch')
          if 'MainChatView.this.presenter.onSheetOptionSelected("compact");' not in main:
              raise RuntimeError('compact presenter callback missing after patch')

          # Full create-or-update payloads. No PAT; only this workflow's short-lived GITHUB_TOKEN.
          update_full(composer_path, composer, 'fix(ui): restore full ComposerView and compact toolbar')
          update_full(main_path, main, 'fix(ui): wire header mode and compact action')
          PY
