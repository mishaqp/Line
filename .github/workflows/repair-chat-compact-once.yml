name: Repair chat compact once

on:
  push:
    branches:
      - feat/chat-compact
    paths:
      - .github/workflows/repair-chat-compact-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and patch full sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: feat/chat-compact
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/${BRANCH}/.github/repair_chat_compact.py" -o /tmp/repair_chat_compact.py
          python3 /tmp/repair_chat_compact.py
