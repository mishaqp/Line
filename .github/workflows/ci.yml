name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-checks:
    name: CI checks (test + lint + debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :feature-model:testDebugUnitTest :feature-tool:testDebugUnitTest > /tmp/gradle-unit.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            mkdir -p diag
            cp /tmp/gradle-unit.log diag/gradle-unit.log
            git config user.name "ci-diag"
            git config user.email "ci-diag@users.noreply.github.com"
            git add diag/gradle-unit.log
            git commit -m "diag: capture failing unit test log"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:ci-diag/arena 2>&1 | tail -2
          fi
          exit $status

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build user-cert debug APK
        run: ./gradlew :app:exportDebugUserCertApk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload user-cert debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-user-cert
          path: app/build/outputs/apk/debugUserCert/export/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
