name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-checks:
    name: CI checks (test + lint + debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest > build-output.log 2>&1

      # 显式跑 root/skill 相关测试类：Gradle 在过滤器匹配不到任何测试时会失败，
      # 因此这一步同时保证这些测试真的存在并执行。
      - name: Run root and skill tool tests
        run: >-
          ./gradlew :feature-tool:testDebugUnitTest
          --tests "cn.lineai.tool.builtin.RootFileExecutorTest"
          --tests "cn.lineai.tool.RootModeShellToolTest"
          --tests "cn.lineai.tool.SkillToolsTest"
          --tests "cn.lineai.tool.ToolPermissionServiceModesTest"
          > tool-tests-output.log 2>&1

      # 日志与产物无法通过 Actions 界面下载时（受限网络），把报告提交回分支，
      # 便于在沙箱里直接读取（含成功运行的测试计数）。[skip ci] 防止自我触发。
      - name: Publish test reports
        if: always()
        run: |
          rm -rf ci-diag
          mkdir -p ci-diag
          cp build-output.log ci-diag/build-output.log || true
          cp tool-tests-output.log ci-diag/tool-tests-output.log || true
          grep -E "error:|FAILED|Execution failed|> Task .* FAILED" build-output.log | head -300 > ci-diag/errors.txt || true
          shopt -s nullglob
          for f in */build/test-results/*/*.xml; do cp "$f" ci-diag/; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-diag
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish failure reports [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build user-cert debug APK
        run: ./gradlew :app:assembleDebugUserCert

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload user-cert debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-user-cert
          path: app/build/outputs/apk/debugUserCert/export/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

