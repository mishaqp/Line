name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-checks:
    name: CI checks (test + lint + debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      # core-model — обычная java-library, её тесты не попадают в :app:testDebugUnitTest.
      - name: Run core-model unit tests
        run: ./gradlew :core-model:test

      # ui-theme — тесты M3-токенов отдельным шагом.
      - name: Run ui-theme unit tests
        run: ./gradlew :ui-theme:testDebugUnitTest

      # :app:testDebugUnitTest 不会编译 :feature-tool 的测试源码，
      # 因此这里显式跑整个 :feature-tool 测试任务（含 root/skill 测试类）。
      - name: Run feature-tool unit tests
        run: ./gradlew :feature-tool:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build user-cert debug APK
        # assembleDebugUserCert 只产出 APK，export 目录由 exportDebugUserCertApk 填充，
        # 少了这一步下面的上传会静默跳过（if-no-files-found: warn）。
        run: ./gradlew :app:assembleDebugUserCert :app:exportDebugUserCertApk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload user-cert debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-user-cert
          path: app/build/outputs/apk/debugUserCert/export/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

