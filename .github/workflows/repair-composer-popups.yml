name: Repair composer popups once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-compact
          fetch-depth: 0
      - name: Apply audit fixes
        run: |
          set -euo pipefail
          python3 scripts/patch_audit_fixes.py
          git config user.name "mishaqp"
          git config user.email "84035331+mishaqp@users.noreply.github.com"
          git add app/src/main/java/cn/lineai/ui/component/ComposerView.java \
                  app/src/main/java/cn/lineai/mvp/MainControllerInitializer.java \
                  app/src/test/java/cn/lineai/mvp/SettingsManagementControllerTest.java
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m "fix: remove dead composer mode chip and localize import dialog"
            git push origin HEAD:feat/chat-compact
          fi
