name: Repair composer popups once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge master into feat/chat-compact
        run: |
          set -euo pipefail
          git config user.name "mishaqp"
          git config user.email "84035331+mishaqp@users.noreply.github.com"
          git fetch origin master feat/chat-compact
          git checkout -B feat/chat-compact origin/feat/chat-compact
          if git merge --no-edit origin/master; then
            echo merge-clean
          else
            echo conflicts:
            git diff --name-only --diff-filter=U || true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .github/workflows/*)
                  git checkout --ours -- "$f" || git rm -f "$f" || true
                  git add -f "$f" || true
                  ;;
                *)
                  git checkout --ours -- "$f"
                  git add -- "$f"
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            git diff --name-only --diff-filter=U && test -z "$(git diff --name-only --diff-filter=U)"
            git commit -m "merge master into feat/chat-compact"
          fi
          git push origin HEAD:feat/chat-compact
